<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Meta Ray-Ban Display uses a fixed 600x600 viewport. -->
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
  <title>DeepSign — Glasses</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- PNG favicon (>=52x52). SVG is not supported by the glasses runtime. -->
  <link rel="icon" type="image/png" href="/icon.png" sizes="256x256" />

  <script type="module" src="https://unpkg.com/pose-viewer/dist/pose-viewer/pose-viewer.esm.js"></script>
  <script nomodule src="https://unpkg.com/pose-viewer/dist/pose-viewer/pose-viewer.js"></script>

  <style>
    * { box-sizing: border-box; }
    /* On the additive waveguide display, pure black renders as transparent, so
       we keep the background black and draw everything in bright, high-contrast
       colors. The runtime locks the viewport to 600x600 with no scrolling. */
    html, body {
      width: 600px; height: 600px;
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: monospace;
      overflow: hidden;
    }
    .wrap {
      width: 600px; height: 600px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #bar { display: flex; align-items: center; font-size: 22px; font-weight: 700; flex: 0 0 auto; }
    #dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 10px; background: #aaa; }
    #dot.live { background: #2ecc71; }
    #dot.error { background: #ff5a5a; }
    /* Bright yellow caption for maximum legibility on the see-through display. */
    #transcript {
      font-size: 24px; line-height: 1.2;
      min-height: 2.4em; max-height: 2.4em; overflow: hidden;
      color: #ffe14d;
      flex: 0 0 auto;
    }
    pose-viewer {
      display: block;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: transparent;
      contain: layout size paint;
    }
    .controls { display: flex; gap: 12px; flex: 0 0 auto; }
    /* Input is arrow-key/Enter via the Neural Band or captouch — every control
       carries `.focusable`, is reachable by D-pad, and shows a bright focus ring. */
    .focusable {
      flex: 1;
      padding: 14px; font-size: 22px; font-weight: 700; font-family: monospace;
      color: #000; background: #ffe14d; border: 3px solid transparent; border-radius: 10px;
      min-height: 88px; /* glasses minimum target size */
      transition: all 120ms ease;
    }
    #micBtn.recording { background: #ff5a5a; color: #fff; }
    .focusable:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="bar" role="status" aria-live="polite"><span id="dot" aria-hidden="true"></span><span id="status-text">Connecting</span></div>
    <div id="transcript" role="log" aria-live="polite" aria-label="Speech transcript"></div>
    <pose-viewer id="signer" autoplay role="img" aria-label="Animated signing avatar"></pose-viewer>
    <div class="controls">
      <button id="micBtn" class="focusable" type="button" autofocus aria-label="Start or stop microphone">Start</button>
      <button id="resetBtn" class="focusable" type="button" aria-label="Reset signing playback">Reset</button>
    </div>
  </div>

  <script>
    const ROOM_ID_PATTERN = /^[a-zA-Z0-9_-]{6,80}$/;
    const roomId = new URLSearchParams(location.search).get('room') || '';
    if (!ROOM_ID_PATTERN.test(roomId)) {
      document.body.textContent = 'Missing or invalid room. Open /glasses to start a private session.';
      throw new Error('Missing or invalid room id');
    }

    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const transcriptEl = document.getElementById('transcript');
    const signer = document.getElementById('signer');
    const micBtn = document.getElementById('micBtn');
    const resetBtn = document.getElementById('resetBtn');
    const companionSpeakPath = `/speak?room=${encodeURIComponent(roomId)}`;

    function setStatus(state, text) {
      dot.className = state === 'live' ? 'live' : state === 'error' ? 'error' : '';
      statusText.textContent = text;
    }

    function wsUrl(role) {
      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const clientParam = role === 'display' ? '?client=glasses' : '';
      return `${wsProto}://${location.host}/ws/${role}/${encodeURIComponent(roomId)}${clientParam}`;
    }

    // --- Pose playback queue ---
    // Each incoming .pose clip is queued and played one at a time. We advance on
    // the component's `ended$` event so a clip always finishes before the next
    // begins — the whole utterance is signed instead of being cut off.
    const poseQueue = [];
    let currentUrl = null;
    let playing = false;
    let watchdog = null;
    let displayWS = null;
    let pendingPoseMetric = null;
    const WATCHDOG_MS = 30000;

    function enqueuePose(blob) {
      const entry = {
        url: URL.createObjectURL(blob),
        receivedAt: performance.now(),
        pipelineId: pendingPoseMetric?.pipelineId || null,
      };
      pendingPoseMetric = null;
      poseQueue.push(entry);
      if (!playing) playNext();
    }

    function clearPoseQueue() {
      while (poseQueue.length) URL.revokeObjectURL(poseQueue.shift().url);
    }

    function playNext() {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }

      if (poseQueue.length === 0) {
        playing = false;
        stopSigning();
        return;
      }

      playing = true;
      const entry = poseQueue.shift();
      const url = entry.url;
      currentUrl = url;

      const apply = () => {
        signer.src = url;
        try { if (typeof signer.play === 'function') signer.play(); } catch (e) {}
        sendDisplayMetric('avatar_playback_start', performance.now() - entry.receivedAt, entry.pipelineId);
        watchdog = setTimeout(playNext, WATCHDOG_MS);
      };
      if (window.customElements && customElements.whenDefined) {
        customElements.whenDefined('pose-viewer').then(apply).catch(apply);
      } else {
        apply();
      }
    }

    function stopSigning() {
      try { if (typeof signer.pause === 'function') signer.pause(); } catch (e) {}
      try { signer.src = ''; } catch (e) {}
      try { signer.removeAttribute('src'); } catch (e) {}
    }

    function resetSigning(notifyServer = true) {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      clearPoseQueue();
      if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
      playing = false;
      stopSigning();
      transcriptEl.textContent = '';
      if (notifyServer && displayWS && displayWS.readyState === WebSocket.OPEN) {
        displayWS.send(JSON.stringify({ type: 'reset' }));
      }
    }

    function sendDisplayMetric(event, durationMs, pipelineId = null) {
      if (!displayWS || displayWS.readyState !== WebSocket.OPEN) return;
      try {
        displayWS.send(JSON.stringify({
          type: 'metrics',
          event,
          durationMs,
          pipelineId,
          status: 'ok',
        }));
      } catch (e) {
        // Metrics are best-effort developer telemetry.
      }
    }

    signer.addEventListener('ended$', () => playNext());

    let recording = false;
    let stream = null;
    let micWs = null;
    let audioContext = null;
    let source = null;
    let processor = null;
    const AUDIO_PROCESSOR_BUFFER_SIZE = 1024;

    // --- Display WebSocket (binary .pose + JSON transcript metadata) ---
    // The glasses load this page over HTTPS, so we must use wss:// (the runtime
    // blocks insecure ws:// as mixed content). Reconnect automatically so the
    // hands-free display recovers without any interaction.
    function connect() {
      displayWS = new WebSocket(wsUrl('display'));
      displayWS.binaryType = 'arraybuffer';
      displayWS.onopen = () => setStatus('live', recording ? 'Listening' : 'Live');
      displayWS.onclose = () => { setStatus('error', 'Reconnecting'); setTimeout(connect, 1500); };
      displayWS.onerror = () => { try { displayWS.close(); } catch (e) {} };
      displayWS.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer || event.data instanceof Blob) {
          const blob = event.data instanceof Blob
            ? event.data
            : new Blob([event.data], { type: 'application/octet-stream' });
          enqueuePose(blob);
        } else {
          let msg;
          try { msg = JSON.parse(event.data); } catch (e) { return; }
          if (msg.type === 'transcript') {
            transcriptEl.textContent = msg.text;
          } else if (msg.type === 'reset') {
            resetSigning(false);
          } else if (msg.type === 'metrics') {
            if (msg.event?.kind === 'timing'
                && msg.event.stage === 'pose_generation'
                && msg.event.status === 'ok'
                && msg.event.pipelineId) {
              pendingPoseMetric = { pipelineId: msg.event.pipelineId };
            }
          } else if (msg.type === 'error') {
            const text = msg.text || msg.error || 'Service unavailable.';
            setStatus('error', 'Service issue');
            transcriptEl.textContent = text;
          }
        }
      };
    }
    connect();

    // --- Mic capture on the glasses → /ws/audio/<room> WebSocket (Int16 PCM @ 16kHz) ---
    // Per Meta's docs the mic permission must be requested from a user gesture
    // (the Start press / Enter). If the glasses runtime exposes the mic, this
    // captures on-device; if it blocks it, we fall back to display-only and tell
    // the wearer to use the companion /speak page on their phone.
    async function startMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('error', 'No mic — use /speak');
        transcriptEl.textContent = `Mic API unavailable on this device. Open ${companionSpeakPath} on your phone.`;
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        console.error('Mic permission/availability error:', e);
        setStatus('error', 'No mic — use /speak');
        transcriptEl.textContent = `Mic blocked on glasses. Open ${companionSpeakPath} on your phone to talk.`;
        return;
      }

      micWs = new WebSocket(wsUrl('audio'));
      micWs.binaryType = 'arraybuffer';
      const activeMicWs = micWs;
      micWs.onopen = () => setStatus('live', 'Listening');
      micWs.onmessage = (event) => {
        let msg; try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === 'error') {
          const text = msg.text || msg.error || 'Speech unavailable.';
          setStatus('error', 'No speech');
          transcriptEl.textContent = text;
        }
      };
      micWs.onclose = (event) => {
        if (micWs !== activeMicWs || !recording) return;
        const text = event.reason || 'Speech connection closed.';
        stopMic();
        setStatus('error', 'No speech');
        transcriptEl.textContent = text;
      };
      micWs.onerror = () => setStatus('error', 'Speech error');

      recording = true;
      micBtn.textContent = 'Stop';
      micBtn.classList.add('recording');

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx({ sampleRate: 16000 });
      source = audioContext.createMediaStreamSource(stream);
      // ScriptProcessor is deprecated but reliably available in embedded WebViews.
      processor = audioContext.createScriptProcessor(AUDIO_PROCESSOR_BUFFER_SIZE, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!micWs || micWs.readyState !== 1) return;
        const float32 = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
        }
        micWs.send(int16.buffer);
      };

      source.connect(processor);
      processor.connect(audioContext.destination);
    }

    function stopMic() {
      try { if (processor) processor.disconnect(); } catch (e) {}
      try { if (source) source.disconnect(); } catch (e) {}
      try { if (audioContext) audioContext.close(); } catch (e) {}
      try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      try { if (micWs && micWs.readyState === 1) micWs.close(); } catch (e) {}
      processor = null; source = null; audioContext = null; stream = null; micWs = null;

      recording = false;
      micBtn.textContent = 'Start';
      micBtn.classList.remove('recording');
      setStatus('live', 'Live');
    }

    async function toggleMic() {
      micBtn.disabled = true;
      try {
        if (recording) stopMic();
        else await startMic();
      } finally {
        micBtn.disabled = false;
      }
    }

    micBtn.addEventListener('click', toggleMic);
    resetBtn.addEventListener('click', () => resetSigning(true));

    // --- Input: Neural Band / captouch map to arrow keys + Enter (per Meta docs) ---
    function moveFocus(direction) {
      const focusables = Array.from(
        document.querySelectorAll('.focusable:not([disabled]):not(.hidden)')
      );
      if (!focusables.length) return;
      let idx = focusables.indexOf(document.activeElement);
      if (idx === -1) { focusables[0].focus(); return; }
      const next = (direction === 'up' || direction === 'left')
        ? (idx > 0 ? idx - 1 : focusables.length - 1)
        : (idx < focusables.length - 1 ? idx + 1 : 0);
      focusables[next].focus();
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'ArrowLeft': moveFocus('up'); break;
        case 'ArrowDown': case 'ArrowRight': moveFocus('down'); break;
        case 'Enter':
          if (document.activeElement && document.activeElement.classList.contains('focusable')) {
            document.activeElement.click();
          }
          break;
        default: return;
      }
      e.preventDefault();
    });

    micBtn.focus();
  </script>
</body>
</html>
