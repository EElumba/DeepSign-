<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASL Pose Viewer</title>

  <script type="module" src="https://unpkg.com/pose-viewer/dist/pose-viewer/pose-viewer.esm.js"></script>
  <script nomodule src="https://unpkg.com/pose-viewer/dist/pose-viewer/pose-viewer.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: monospace;
      height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    .wrap { width: 100%; max-width: 400px; padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
    #bar { display: flex; align-items: center; font-size: 13px; }
    #dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #888; }
    #dot.live { background: #2ecc71; }
    #dot.error { background: #e74c3c; }
    #transcript {
      font-size: 13px; line-height: 1.3; min-height: 2.6em;
      max-height: 2.6em; overflow: hidden;
      background: rgba(255,255,255,0.06); border-radius: 6px; padding: 6px 8px;
    }
    pose-viewer { width: 100%; height: 300px; background: #111; border-radius: 6px; flex: 1; }
    #micBtn {
      padding: 12px; font-size: 14px; font-weight: 600; font-family: monospace;
      color: #fff; background: #2ecc71; border: none; border-radius: 8px; cursor: pointer;
    }
    #micBtn.recording { background: #e74c3c; }
    #micBtn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="bar"><span id="dot"></span><span id="status-text">Connecting</span></div>
    <div id="transcript"></div>
    <pose-viewer id="signer" autoplay></pose-viewer>
    <button id="micBtn">Start</button>
  </div>

  <script>
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const transcriptEl = document.getElementById('transcript');
    const signer = document.getElementById('signer');

    function setStatus(state, text) {
      dot.className = state === 'live' ? 'live' : state === 'error' ? 'error' : '';
      statusText.textContent = text;
    }

    // --- Pose playback queue ---
    // Each incoming .pose clip (a ~4-word chunk) is queued and played one at a
    // time. We advance on the component's `ended$` event so a clip always finishes
    // before the next begins — the whole sentence is signed instead of being cut off.
    const poseQueue = [];
    let currentUrl = null;
    let playing = false;
    let watchdog = null;
    const WATCHDOG_MS = 30000; // safety net in case `ended$` never fires

    function enqueuePose(blob) {
      poseQueue.push(URL.createObjectURL(blob));
      if (!playing) playNext();
    }

    function playNext() {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      // Release the clip that just finished.
      if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }

      // Queue drained — stop signing and clear the avatar instead of freezing
      // on the last frame.
      if (poseQueue.length === 0) {
        playing = false;
        stopSigning();
        return;
      }

      playing = true;
      const url = poseQueue.shift();
      currentUrl = url;

      const apply = () => {
        signer.src = url;
        try { if (typeof signer.play === 'function') signer.play(); } catch (e) {}
        // If the clip never reports `ended$`, advance anyway after a timeout.
        watchdog = setTimeout(playNext, WATCHDOG_MS);
      };
      if (window.customElements && customElements.whenDefined) {
        customElements.whenDefined('pose-viewer').then(apply).catch(apply);
      } else {
        apply();
      }
    }

    // Halt playback and clear the rendered pose so the skeleton stops signing.
    function stopSigning() {
      try { if (typeof signer.pause === 'function') signer.pause(); } catch (e) {}
      try { signer.src = ''; } catch (e) {}
      try { signer.removeAttribute('src'); } catch (e) {}
    }

    // pose-viewer fires `ended$` when a clip finishes (it must NOT have `loop`).
    signer.addEventListener('ended$', () => playNext());

    // --- Display WebSocket (binary .pose + JSON transcript metadata) ---
    const displayWS = new WebSocket(`ws://${location.host}`);
    displayWS.binaryType = 'arraybuffer';
    displayWS.onopen = () => setStatus('live', 'Live');
    displayWS.onclose = () => setStatus('error', 'Error');
    displayWS.onerror = () => setStatus('error', 'Error');
    displayWS.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer || event.data instanceof Blob) {
        const blob = event.data instanceof Blob
          ? event.data
          : new Blob([event.data], { type: 'application/octet-stream' });
        enqueuePose(blob);
      } else {
        let msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === 'transcript') {
          transcriptEl.textContent = msg.text;
        }
      }
    };

    // --- Mic capture → /audio WebSocket (Int16 PCM @ 16kHz mono) ---
    const micBtn = document.getElementById('micBtn');
    let recording = false;
    let stream = null;
    let micWs = null;
    let audioContext = null;
    let source = null;
    let processor = null;

    async function startMic() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        console.error('Mic permission denied:', e);
        setStatus('error', 'Mic denied');
        return;
      }

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      micWs = new WebSocket(`${proto}://${location.host}/audio`);
      micWs.binaryType = 'arraybuffer';

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx({ sampleRate: 16000 });
      source = audioContext.createMediaStreamSource(stream);
      // ScriptProcessor is deprecated but reliably available in the glasses WebView.
      processor = audioContext.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!micWs || micWs.readyState !== 1) return;
        const float32 = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          int16[i] = Math.max(-32768, Math.min(32767, float32[i] * 32768));
        }
        micWs.send(int16.buffer);
      };

      source.connect(processor);
      processor.connect(audioContext.destination);

      recording = true;
      micBtn.textContent = 'Stop';
      micBtn.classList.add('recording');
    }

    function stopMic() {
      try { if (processor) processor.disconnect(); } catch (e) {}
      try { if (source) source.disconnect(); } catch (e) {}
      try { if (audioContext) audioContext.close(); } catch (e) {}
      try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      try { if (micWs && micWs.readyState === 1) micWs.close(); } catch (e) {}
      processor = null;
      source = null;
      audioContext = null;
      stream = null;
      micWs = null;

      recording = false;
      micBtn.textContent = 'Start';
      micBtn.classList.remove('recording');
    }

    micBtn.addEventListener('click', async () => {
      micBtn.disabled = true;
      try {
        if (recording) stopMic();
        else await startMic();
      } finally {
        micBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
