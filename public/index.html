<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DeepSign Quest ASL Avatar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="stage" aria-label="Signing avatar">
      <div class="status-row">
        <span id="socketDot" class="dot"></span>
        <span id="statusText">Connecting</span>
        <span id="modeBadge">Typed mode</span>
      </div>
      <canvas id="signCanvas" aria-label="Procedural two-handed signing skeleton"></canvas>
      <div id="caption" class="caption"></div>
    </section>

    <aside class="control-panel" aria-label="Controls">
      <div class="transcript-box">
        <div class="label">Transcript</div>
        <div id="transcript">Waiting for input.</div>
      </div>

      <div class="plan-box">
        <div class="label">ASL plan</div>
        <div id="plan">No plan yet.</div>
      </div>

      <form id="textForm" class="text-form">
        <input id="textInput" autocomplete="off" placeholder="Type a test phrase" />
        <button type="submit">Sign</button>
      </form>

      <button id="micBtn" class="mic-button" type="button">Start mic</button>
    </aside>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
